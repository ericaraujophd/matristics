project:
  type: website
  output-dir: _site

execute:
  enabled: false

website:
  title: "LLM Evaluation in Early Church History"
  site-url: https://ericaraujophd.github.io/matristics
  description: "Comparing how AI models handle knowledge of women in early Christianity"
  favicon: _static/fractio_panis.jpg
  search:
    location: navbar
    type: overlay
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    background: "#4A1233"
    foreground: "#F5EFE6"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Methodology"
        href: methodology/index.qmd
      - text: "Figures"
        href: figures/index.qmd
      - text: "Benchmark"
        href: benchmark/index.qmd
      - text: "About"
        href: about.qmd
  sidebar:
    style: "docked"
    background: "#F4EEE3"
    collapse-level: 1
    contents:
      - index.qmd
      - section: "Background"
        contents:
          - background/historical-context.qmd
          - background/llm-evaluation-context.qmd
      - section: "Methodology"
        contents:
          - methodology/index.qmd
          - methodology/evaluation-paradigms.qmd
          - methodology/rubric.qmd
          - methodology/annotation-protocol.qmd
          - methodology/agreement-metrics.qmd
      - section: "Known LLM Biases"
        contents:
          - biases/index.qmd
          - biases/hallucination.qmd
          - biases/androcentric-bias.qmd
          - biases/contested-scholarship.qmd
      - section: "Figures"
        contents:
          - figures/index.qmd
          - figures/macrina.qmd
          - figures/olympias.qmd
      - section: "Data Collection"
        contents:
          - data-collection/index.qmd
          - data-collection/setup.qmd
          - data-collection/claude.ipynb
          - data-collection/openai.ipynb
          - data-collection/gemini.ipynb
          - data-collection/grok.ipynb
          - data-collection/batch-collection.ipynb
      - section: "Benchmark"
        contents:
          - benchmark/index.qmd
          - benchmark/by-model.qmd
          - benchmark/by-dimension.qmd
          - benchmark/by-figure.qmd
      - replicate/index.qmd
      - about.qmd
      - glossary.qmd
      - references.qmd
  page-footer:
    center: |
      LLM Evaluation in Early Church History · Eric Araújo, Calvin University · CC-BY-4.0

bibliography: references.bib

format:
  html:
    theme: [theme.scss]
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    number-sections: false
    link-external-newwindow: true
    smooth-scroll: true
    grid:
      sidebar-width: 290px
      body-width: 780px
      margin-width: 250px
