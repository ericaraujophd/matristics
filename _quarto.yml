project:
  type: website
  output-dir: _site

execute:
  enabled: false

website:
  title: "Matristics"
  site-url: https://ericaraujo.com/matristics
  description: "Evaluating large language models on the women of the early church"
  favicon: _static/fractio_panis.jpg
  search:
    location: navbar
    type: overlay
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    background: "#4A1233"
    foreground: "#F5EFE6"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Methodology"
        href: methodology/index.qmd
      - text: "Figures"
        href: figures/index.qmd
      - text: "Benchmark"
        href: benchmark/index.qmd
      - text: "About"
        href: about.qmd
  sidebar:
    style: "docked"
    background: "#F4EEE3"
    collapse-level: 1
    contents:
      - index.qmd
      - text: "Background"
        href: background/index.qmd
      - text: "Methodology"
        href: methodology/index.qmd
      - text: "Known LLM Biases"
        href: biases/index.qmd
      - section: "Figures"
        contents:
          - figures/index.qmd
          - figures/macrina.qmd
          - figures/olympias.qmd
      - section: "Data Collection"
        contents:
          - data-collection/index.qmd
          - data-collection/setup.qmd
      - text: "Benchmark"
        href: benchmark/index.qmd
      - replicate/index.qmd
      - about.qmd
      - glossary.qmd
      - references.qmd
  page-footer:
    center: |
      Matristics · Eric Araújo, Calvin University · CC-BY-4.0

bibliography: references.bib

format:
  html:
    theme: [theme.scss]
    toc: false
    number-sections: false
    link-external-newwindow: true
    smooth-scroll: true
    grid:
      sidebar-width: 290px
      body-width: 1000px
      margin-width: 0px
